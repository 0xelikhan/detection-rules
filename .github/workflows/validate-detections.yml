name: Validate Detection Rules
on:
  push:
    paths:
      - 'sigma/**'
      - 'yara/**'
  pull_request:
    paths:
      - 'sigma/**'
      - 'yara/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sigma-cli and backends
        run: |
          pip install sigma-cli
          pip install pySigma-backend-elasticsearch
          pip install pySigma-backend-splunk
          pip install PyYAML
      - name: Validate Sigma rule syntax
        run: python3 scripts/validate_rules.py
      - name: Convert rules to Elastic format
        run: |
          mkdir -p converted
          for rule in sigma/**/*.yml; do
            echo "Converting: $rule"
            sigma convert -t lucene "$rule" >> converted/elastic_rules.txt 2>&1 || true
          done
      - name: Convert rules to Splunk format
        run: |
          for rule in sigma/**/*.yml; do
            sigma convert -t splunk "$rule" >> converted/splunk_rules.txt 2>&1 || true
          done
      - name: Show conversion summary
        run: |
          echo "=== Elastic rules ==="
          wc -l converted/elastic_rules.txt || true
          echo "=== Splunk rules ==="
          wc -l converted/splunk_rules.txt || true
      - name: Upload converted rules
        uses: actions/upload-artifact@v4
        with:
          name: converted-rules
          path: converted/
