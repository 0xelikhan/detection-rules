name: Validate Detection Rules
on:
  push:
    paths:
      - 'sigma/**'
      - 'yara/**'
  pull_request:
    paths:
      - 'sigma/**'
      - 'yara/**'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sigma-cli and backends
        run: |
          pip install sigma-cli
          pip install pySigma-backend-elasticsearch
          pip install pySigma-backend-splunk
          pip install PyYAML
      - name: Validate Sigma rule syntax
        run: python3 scripts/validate_rules.py
      - name: Convert rules to Elastic and Splunk
        run: |
          mkdir -p converted
          find sigma \( -name '*.yml' -o -name '*.yaml' \) -type f | while read -r rule; do
            echo "Converting: $rule"
            sigma convert -t lucene --without-pipeline "$rule" >> converted/elastic_rules.txt 2>> converted/errors.txt || echo "FAILED elastic: $rule" >> converted/errors.txt
            sigma convert -t splunk --without-pipeline "$rule" >> converted/splunk_rules.txt 2>> converted/errors.txt || echo "FAILED splunk: $rule" >> converted/errors.txt
          done
      - name: Show results
        run: |
          echo "=== Elastic ===" ; cat converted/elastic_rules.txt || echo "EMPTY"
          echo "=== Splunk ===" ; cat converted/splunk_rules.txt || echo "EMPTY"
          echo "=== Errors ===" ; cat converted/errors.txt || echo "NONE"
      - name: Upload converted rules
        uses: actions/upload-artifact@v4
        with:
          name: converted-rules
          path: converted/
        if: always()
